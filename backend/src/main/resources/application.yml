server:
  port: 8081

spring:
  application:
    name: coding-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/web_platform
    username: postgres
    password: deepa

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.springframework: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

  api-docs:
    path: /v3/api-docs

jwt:
  secret: 12345678901234567890123456789012
  expiration: 86400000